# Builds dist/ and deploys it to GitHub Pages on every push to main.
#
# One-time setting before the first run: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The app is plain HTML, CSS and ES modules, so the build only copies the files the site needs.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build dist/ (only the files the site needs)
        run: |
          mkdir dist
          cp index.html coi-serviceworker.js manifest.webmanifest robots.txt sitemap.xml LICENSE dist/
          cp -r css js vendor assets samples dist/
          rm -f dist/assets/social-preview.html
          touch dist/.nojekyll
          echo "Built $(find dist -type f | wc -l) files ($(du -sh dist | cut -f1))"
      - name: Check the build has the app
        run: |
          for f in index.html js/app.js css/app.css vendor/duckdb/duckdb-eh.wasm samples/sales.csv; do
            test -f "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
